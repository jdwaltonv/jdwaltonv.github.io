remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  
title: Chedalabs Homelab
description: Homelab projects, learning, and tinkering

collections:
  projects:
    output: true
    permalink: /projects/:name/
  notes:
    output: true
    permalink: /notes/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: default
  - scope:
      path: ""
      type: notes
    values:
      layout: default
